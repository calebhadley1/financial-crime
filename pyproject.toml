[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "financial_crime"
version = "0.0.1"
description = "Financial Crime detection using Machine Learning"
authors = [
  { name = "Caleb Hadley" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "fastapi[standard]",
    "feast",
    "imblearn",
    "kafka-python>=3.0.11",
    "loguru",
    "mkdocs",
    "pandas",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["financial_crime"]
include = ["pyproject.toml", "financial_crime/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["financial_crime"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "matplotlib>=3.11.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

